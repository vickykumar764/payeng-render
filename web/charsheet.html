<!doctype html><html><body style="margin:0;background:#9fb7d6">
<canvas id="c" width="2400" height="2200"></canvas>
<script type="module">
import * as T from "./toon.js"; import * as C from "./castdefs.js";
const g = document.getElementById("c").getContext("2d");
const cell = (i, j, fn, w = 600, h = 1000) => { g.save(); g.translate(i * 480 - 60, j * 1080 + 40); g.scale(0.8, 0.8); g.translate((600 - w) / 2, 1000 - h); fn(new T.Pen(g)); g.restore(); };
const L = -Math.PI * 2 / 3;
cell(0, 0, (p) => T.bodyFrontX(p, C.MANJHI_Y, { expr: "stubborn", armR: "shoulder", hammer: "shoulder", seed: 3, light: L }));
cell(1, 0, (p) => T.bodyFrontX(p, C.FALGUNI, { expr: "smile", armR: "pot", pot: true, seed: 5, light: L }));
cell(2, 0, (p) => T.bodyFrontX(p, C.VIL_1, { expr: "laugh", armL: "belly", armR: "belly", seed: 7, light: L }));
cell(3, 0, (p) => T.bodyFrontX(p, C.VIL_2, { expr: "mock", armR: "temple", swirl: 0.3, seed: 9, light: L }));
cell(4, 0, (p) => T.bodyFrontX(p, C.VIL_3, { expr: "grin", armR: "point", armL: "hip", seed: 11, light: L }));
cell(0, 1, (p) => T.bodySideX(p, C.MANJHI_Y, { mode: "hammer", k: 0.0, expr: "stubborn", seed: 3, light: L }));
cell(1, 1, (p) => T.bodySideX(p, C.MANJHI_M, { mode: "hammer", k: 1.0, expr: "strain", seed: 3, light: L }));
cell(2, 1, (p) => T.bodySideX(p, C.MANJHI_O, { mode: "walk", phase: 0.2, expr: "neutral", seed: 3, light: L }));
cell(3, 1, (p) => T.bodySideX(p, C.FALGUNI, { mode: "walk", phase: 0.6, pot: true, expr: "calm", seed: 5, light: L }));
cell(4, 1, (p) => T.bodyFrontX(p, C.MANJHI_O, { expr: "soft", armR: "shoulder", hammer: "shoulder", seed: 3, light: L }));
window.done = true;
</script></body></html>
