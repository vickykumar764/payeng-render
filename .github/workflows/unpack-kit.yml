name: Unpack kit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack archive into repo root
        run: |
          unzip -o payeng-render-upload.zip
          cp -r payeng-render/. .
          rm -rf payeng-render payeng-render-upload.zip .github/workflows/unpack-kit.yml
          ls -la
          ls .github/workflows
      - name: Commit extracted files
        run: |
          git config user.name "vickykumar764"
          git config user.email "vickyvickykumar764@gmail.com"
          git add -A
          git status --short
          git commit -m "Payeng kit + render workflows (50-frame test)" || echo "nothing to commit"
          git push
